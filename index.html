ungan kekerabatan klien"], c: 0 },{ q: "Bila Penilai dihadapkan pada situasi benturan kepentingan dalam penugasan, tindakan etis utamanya adalah...", a: ["Tetap melanjutkan tanpa pemberitahuan", "Mengundurkan diri atau mengungkapkan konflik secara transparan kepada klien", "Menyerahkan laporan tanpa tanda tangan", "Menaikkan tarif jasa penilaian"], c: 1 },{ q: "Berikut ini struktur elemen eksternal kota yang memengaruhi makro nilai properti, kecuali...", a: ["Kebijakan fiskal pemerintah", "Kondisi topografi tanah", "Pertumbuhan demografi regional", "Interior arsitektur bangunan"], c: 3 }];// Loop untuk generate otomatis menjadi 35 Soal berbedafor (let i = 1; i <= 35; i++) {const base = baseKEPIQuestions[(i - 1) % baseKEPIQuestions.length];questionsData.push({id: i,question: [Soal ${i}] ${base.q},options: [...base.options],correctIndex: base.c});}// Bobot Penilaian (Ketetapan Soal)const SCORE_PER_CORRECT = 2.857142857142857;let currentIdx = 0;let timeRemaining = 3600; // 60 Menitlet timerInterval = null;let isTimerRunning = true;let isSubmitted = false;// Memori Penyimpanan Jawaban Sementaraconst userAnswers = JSON.parse(localStorage.getItem('kepi_quiz_answers')) || {};function initQuiz() {renderGrid();renderQuestion();startTimer();}function renderQuestion() {const card = document.getElementById('question-card');if(!card) return;const q = questionsData[currentIdx];let optionsHTML = '';q.options.forEach((opt, idx) => {const checked = userAnswers[currentIdx] === idx ? 'checked' : '';let disabledAttr = isSubmitted ? 'disabled' : '';let feedbackClass = '';if (isSubmitted) {if (idx === q.correctIndex) feedbackClass = 'style="background-color: #d1fae5; border-color: var(--success-green);"';else if (userAnswers[currentIdx] === idx && idx !== q.correctIndex) feedbackClass = 'style="background-color: #fee2e2; border-color: var(--danger-red);"';}optionsHTML += ``;});let feedbackBanner = '';if (isSubmitted) {const isCorrect = userAnswers[currentIdx] === q.correctIndex;feedbackBanner = isCorrect? <div class="feedback-box feedback-correct">✓ Jawaban Anda Benar (Skor +${SCORE_PER_CORRECT.toFixed(5)})</div>: <div class="feedback-box feedback-incorrect">✗ Jawaban Anda Salah. Pilihan tepat adalah: ${String.fromCharCode(65 + q.correctIndex)}</div>;}card.innerHTML = <div class="question-text"><strong>Pertanyaan ${q.id}:</strong><br>${q.question}</div> <div class="options-container">${optionsHTML}</div> ${feedbackBanner};document.getElementById('prev-btn').disabled = currentIdx === 0;document.getElementById('next-btn').disabled = currentIdx === questionsData.length - 1;document.querySelectorAll('.grid-item').forEach((btn, index) => {btn.classList.toggle('active', index === currentIdx);});}function renderGrid() {const grid = document.getElementById('question-nav-grid');if(!grid) return;grid.innerHTML = '';questionsData.forEach((q, idx) => {let statusClass = '';if (userAnswers[idx] !== undefined) statusClass = 'answered';const btn = document.createElement('button');btn.className = grid-item ${statusClass};btn.innerText = q.id;btn.onclick = () => {currentIdx = idx;renderQuestion();};grid.appendChild(btn);});}function saveAnswer(qIdx, optIdx) {if (isSubmitted) return;userAnswers[qIdx] = optIdx;localStorage.setItem('kepi_quiz_answers', JSON.stringify(userAnswers));const gridItems = document.querySelectorAll('#question-nav-grid .grid-item');if (gridItems[qIdx]) {gridItems[qIdx].classList.add('answered');}}function changeQuestion(step) {const target = currentIdx + step;if (target >= 0 && target < questionsData.length) {currentIdx = target;renderQuestion();}}// Timer Enginefunction startTimer() {clearInterval(timerInterval);timerInterval = setInterval(() => {if (!isTimerRunning) return;timeRemaining--;updateTimerDisplay();if (timeRemaining <= 0) {clearInterval(timerInterval);autoSubmitQuiz();}}, 1000);}function updateTimerDisplay() {const display = document.getElementById('timer-display');if(!display) return;const minutes = Math.floor(timeRemaining / 60);const seconds = timeRemaining % 60;display.innerText = ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')};if (timeRemaining <= 300) {display.style.borderColor = 'var(--danger-red)';display.style.color = 'var(--danger-red)';} else if (timeRemaining <= 900) {display.style.borderColor = 'var(--warning-yellow)';display.style.color = 'var(--warning-yellow)';} else {display.style.borderColor = 'var(--success-green)';display.style.color = 'var(--text-light)';}}function toggleTimer() {if (isSubmitted) return;isTimerRunning = !isTimerRunning;const btn = document.getElementById('toggle-timer-btn');btn.innerText = isTimerRunning ? "Pause" : "Resume";btn.style.backgroundColor = isTimerRunning ? "rgba(255,255,255,0.2)" : "var(--orange-pagination)";}// Modal Controlfunction openSubmitModal() {if (isSubmitted) return;const totalAnswered = Object.keys(userAnswers).length;const totalQuestions = questionsData.length;document.getElementById('modal-body-text').innerText =Anda telah menjawab ${totalAnswered} dari ${totalQuestions} soal. Apakah Anda yakin ingin mengirimkan kuis ini sekarang?;document.getElementById('confirm-modal').style.display = 'flex';}function closeSubmitModal() {document.getElementById('confirm-modal').style.display = 'none';}// Kalkulasi Skor Akhirfunction submitQuiz() {isSubmitted = true;isTimerRunning = false;clearInterval(timerInterval);closeSubmitModal();document.getElementById('toggle-timer-btn').style.display = 'none';let correctCount = 0;questionsData.forEach((q, idx) => {if (userAnswers[idx] === q.correctIndex) {correctCount++;}});const finalScore = correctCount * SCORE_PER_CORRECT;localStorage.removeItem('kepi_quiz_answers'); // Bersihkan penyimpanan setelah kirimconst quizArea = document.getElementById('quiz-area');quizArea.innerHTML = <div class="card results-summary"> <h2>Hasil Ujian Selesai!</h2> <p>Skor Evaluasi Kompetensi KEPI Anda:</p> <div class="score-big">${finalScore.toFixed(2)} / 100</div> <p>Benar: <strong>${correctCount}</strong> | Salah/Kosong: <strong>${questionsData.length - correctCount}</strong> dari ${questionsData.length} Soal</p> <button class="nav-btn" style="margin-top:20px;" onclick="location.reload()">Ulangi Kuis</button> </div> <div class="card"> <h3>Review Lembar Jawaban</h3> <p style="margin-bottom: 15px; color:#6b7280;">Gunakan navigasi di bawah ini untuk melihat ulasan kunci jawaban pada tiap nomor.</p> <div class="question-grid" id="review-grid"></div> </div>;// Membuat review grid baru di bawah hasil nilaiconst reviewGrid = document.getElementById('review-grid');questionsData.forEach((q, idx) => {const btn = document.createElement('button');const isCorrect = userAnswers[idx] === q.correctIndex;btn.className = grid-item;btn.style.backgroundColor = isCorrect ? 'var(--success-green)' : 'var(--danger-red)';btn.style.color = 'white';btn.innerText = q.id;btn.onclick = () => {showReviewQuestion(idx);};reviewGrid.appendChild(btn);});const detailCard = document.createElement('div');detailCard.className = 'card';detailCard.id = 'question-card';quizArea.insertBefore(detailCard, reviewGrid.closest('.card'));currentIdx = 0;renderQuestion();}function showReviewQuestion(idx) {currentIdx = idx;renderQuestion();document.querySelectorAll('#review-grid .grid-item').forEach((btn, i) => {btn.style.outline = i === idx ? '3px solid black' : 'none';});}function autoSubmitQuiz() {alert('Waktu Anda telah habis! Sistem mengirimkan lembar jawaban secara otomatis.');submitQuiz();}function toggleSidebar() {document.getElementById('sidebar').classList.toggle('collapsed');}window.onload = initQuiz;
