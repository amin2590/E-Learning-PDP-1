laku Profesional,",correct: "d"},{q: "Pengawasan penerimaan atau pemberian hadiah, komisi, dan jenis lainnya dalam pelaksanaan jasa penilaian termasuk pelanggaran terhadap:",a: "Tanggung jawab terhadap sesama Penilai dan Kantor Jasa Penilai Publik,",b: "Tanggung jawab terhadap diri sendiri,",c: "Tanggung jawab terhadap masyarakat,",d: "Tanggung Jawab terhadap Integritas Pribadi Penilai.",correct: "d"}];// STATE APLIKASIlet currentIdx = 0;let userAnswers = new Array(quizData.length).fill(null);let examFinished = false;// PENGATURAN SKOR & WEB APP URLconst BOBOT_SKOR = 2.857142857142857;const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkpi0yJRgy3mm9SP55gVC_dx4kn9EXmIctin2dinFKwkZw7rrcu5GbN8KUXdWayu83/exec";// TIMER STATElet totalSeconds = 60 * 60; // 60 Menitlet timerInterval = null;let isPaused = false;// INISIALISASI SAAT HALAMAN DIBUKAwindow.onload = function() {renderPageNumbers();loadQuestion(0);startTimer();};// RENDER ANGKA NAVIGASIfunction renderPageNumbers() {const container = document.getElementById("pageNumbersContainer");container.innerHTML = "";quizData.forEach((_, idx) => {const btn = document.createElement("div");btn.className = "page-num";btn.id = pagenum-${idx};btn.innerText = idx + 1;btn.onclick = () => { saveCurrentAnswer(); loadQuestion(idx); };container.appendChild(btn);});}// LOAD DETAIL SOALfunction loadQuestion(idx) {currentIdx = idx;const item = quizData[idx];// Perbarui status kelas aktif di navigasi halamandocument.querySelectorAll(".page-num").forEach((el, i) => {el.classList.remove("active");if(userAnswers[i] !== null) {el.classList.add("answered");}});document.getElementById(pagenum-${idx}).classList.add("active");// Pasang teks soaldocument.getElementById("questionText").innerText = ${idx + 1}. ${item.q};// Pasang pilihan jawabanconst container = document.getElementById("optionsContainer");container.innerHTML = "";const options = ['a', 'b', 'c', 'd'];options.forEach(opt => {const optionWrapper = document.createElement("div");optionWrapper.className = "option-item";optionWrapper.id = wrapper-${opt};const radio = document.createElement("input");radio.type = "radio";radio.name = "quizOption";radio.value = opt;radio.id = opt-${opt};// Kembalikan jawaban yang pernah dipilih sebelumnyaif(userAnswers[idx] === opt) {radio.checked = true;}// Kunci input jika kuis telah berakhir/selesai waktuif(examFinished) {radio.disabled = true;}const label = document.createElement("label");label.className = "option-label";label.htmlFor = opt-${opt};label.innerText = ${opt.toUpperCase()}. ${item[opt]};optionWrapper.appendChild(radio);optionWrapper.appendChild(label);// Event listener klik area box pilihan jawabanoptionWrapper.onclick = () => {if(!examFinished) {radio.checked = true;saveCurrentAnswer();}};container.appendChild(optionWrapper);});// Jika kuis sudah selesai, langsung munculkan feedback benar/salah pada pilihan tersebutif(examFinished) {showFeedbackForCurrentQuestion();}}// SIMPAN JAWABAN SAAT BERPINDAHfunction saveCurrentAnswer() {const selected = document.querySelector('input[name="quizOption"]:checked');if(selected) {userAnswers[currentIdx] = selected.value;document.getElementById(pagenum-${currentIdx}).classList.add("answered");}}// TOMBOL NAVIGASI SEBELUMNYA & SELANJUTNYAfunction nextQuestion() {saveCurrentAnswer();if(currentIdx < quizData.length - 1) {loadQuestion(currentIdx + 1);} else if(!examFinished) {if(confirm("Apakah Anda yakin ingin menyelesaikan kuis ini dan melihat hasil?")) {finishQuiz();}}}function prevQuestion() {saveCurrentAnswer();if(currentIdx > 0) {loadQuestion(currentIdx - 1);}}// HITUNG MUNDUR TIMERfunction startTimer() {timerInterval = setInterval(() => {if(!isPaused) {totalSeconds--;updateTimerUI();if(totalSeconds <= 0) {clearInterval(timerInterval);alert("Waktu habis! Kuis otomatis diselesaikan.");finishQuiz();}}}, 1000);}function updateTimerUI() {const minutes = Math.floor(totalSeconds / 60);const seconds = totalSeconds % 60;const stringTime = ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')};document.getElementById("timeString").innerText = stringTime;const timerCircle = document.getElementById("timerCircle");// PERUBAHAN WARNA SESUAI SISA WAKTUif(totalSeconds > 15 * 60) {timerCircle.style.borderColor = "#2ec4b6"; // Hijau/Teal Aman} else if (totalSeconds <= 15 * 60 && totalSeconds > 5 * 60) {timerCircle.style.borderColor = "#ff9f1c"; // Jingga Peringatan} else {timerCircle.style.borderColor = "#e71d36"; // Merah Kritis}}// FITUR PAUSE/RESUME TIMER KETIKA DIKLIKfunction toggleTimer() {if(examFinished) return;isPaused = !isPaused;const statusLabel = document.getElementById("timerStatusLabel");if(isPaused) {statusLabel.innerText = "Paused";statusLabel.style.backgroundColor = "rgba(231, 29, 54, 0.4)";} else {statusLabel.innerText = "Running";statusLabel.style.backgroundColor = "rgba(0, 0, 0, 0.2)";}}// HITUNG SKOR & AKHIRI KUISfunction finishQuiz() {saveCurrentAnswer();examFinished = true;isPaused = true;clearInterval(timerInterval);document.getElementById("timerStatusLabel").innerText = "Finished";let correctCount = 0;quizData.forEach((item, idx) => {if(userAnswers[idx] === item.correct) {correctCount++;}});// Perhitungan skor berdasarkan rumus kustomlet finalScore = correctCount * BOBOT_SKOR;if(finalScore > 100) finalScore = 100; // Pembatas batas atas jika toleransi pembulatan// Tampilkan Panel Hasildocument.getElementById("finalScore").innerText = finalScore.toFixed(2);document.getElementById("scoreSummary").innerText = Anda menjawab benar ${correctCount} dari ${quizData.length} soal.;document.getElementById("resultPanel").style.display = "block";// Tampilkan feedback visual di soal aktif sekarangshowFeedbackForCurrentQuestion();// Scroll otomatis ke atas melihat nilaiwindow.scrollTo({top: 0, behavior: 'smooth'});}// FEEDBACK JAWABAN BENAR DAN SALAHfunction showFeedbackForCurrentQuestion() {const item = quizData[currentIdx];const selectedAnswer = userAnswers[currentIdx];// Tandai jawaban benar yang se ### Fitur yang Diimplementasikan:
1. **Desain Elegan & Responsif:** Tata letak disesuaikan mirip dengan gambar antarmuka asli Anda (sidebar biru dengan profil di kiri, navigasi nomor halaman berwarna kuning, dan area soal putih bersih). Otomatis bertransformasi menjadi ringkas dan ramah sentuhan saat diakses via ponsel pintar.
2. **Bank Soal Dokumen `KEPI KUIS.pdf`:** Semua soal berserta kunci jawaban valid dari dokumen tersemat secara presisi di dalam skrip `quizData`.
3. **Penyimpanan State Dinamis:** Pilihan jawaban Anda tidak akan hilang atau tereset ketika berpindah-pindah soal menggunakan tombol nomor halaman maupun navigasi *Sebelumnya*/*Selanjutnya*.
4. **Sistem Waktu Pintar (60:00 menit):** Timer interaktif dapat di-*pause* atau di-*resume* hanya dengan mengeklik lingkaran waktu tersebut. Lingkaran tepi akan berganti warna otomatis (Hijau ke Jingga lalu Merah) seiring menipisnya sisa waktu.
5. **Kalkulator Skor Presisi:** Menggunakan variabel pembobot eksak `2.857142857142857` per jawaban benar sesuai dengan instruksi khusus Anda.
6. **Integrasi Spreadsheet Langsung:** Tombol **Kirim** telah dikonfigurasikan siap menyalurkan data Nama, ID, Jumlah Benar/Salah, dan Nilai Akhir ke URL Google Apps Script Web App yang Anda tautkan.
